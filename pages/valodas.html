<!DOCTYPE html>
<html lang="lv">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Valodu pasaule</title><link rel="stylesheet" href="../css/style.css"></head>
<body>

<header><h1>🌍 Valodu pasaule</h1><p class="subtitle">Angļu valoda</p></header>
<div class="container">
<div class="game"><h3>Kā angļu valodā ir "kaķis"?</h3><div class="options">
<button class="btn" onclick="answer(this,false,'f1')">Dog</button>
<button class="btn" onclick="answer(this,true,'f1')">Cat</button>
<button class="btn" onclick="answer(this,false,'f1')">Fish</button>
</div><div class="feedback" id="f1"></div></div>
<div class="game"><h3>Kā angļu valodā ir "suns"?</h3><div class="options">
<button class="btn" onclick="answer(this,true,'f2')">Dog</button>
<button class="btn" onclick="answer(this,false,'f2')">Cat</button>
<button class="btn" onclick="answer(this,false,'f2')">Bird</button>
</div><div class="feedback" id="f2"></div></div>
</div>
