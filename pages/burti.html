<!DOCTYPE html>
<html lang="lv">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Burtu pasaule</title><link rel="stylesheet" href="../css/style.css"></head>
<body>

<header><h1>🔤 Burtu pasaule</h1><p class="subtitle">Lasīšana un rakstīšana</p></header>
<div class="container">
<div class="game"><h3>Kurš burts ir A?</h3><div class="options">
<button class="btn" onclick="answer(this,false,'f1')">B</button>

<button class="btn" onclick="answer(this,false,'f1')">C</button>
</div><div class="feedback" id="f1"></div></div>
<div class="game"><h3>Kurš vārds sākas ar M?</h3><div class="options">
<button class="btn" onclick="answer(this,true,'f2')">Māja</button>
<button class="btn" onclick="answer(this,false,'f2')">Zivs</button>
<button class="btn" onclick="answer(this,false,'f2')">Kaķis</button>
</div><div class="feedback" id="f2"></div></div>
</div>
<script src="../js/app.js"></script>
