<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zilbju lasīšanas treniņš</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/animations.css">
<style>
.syllable{font-size:clamp(5rem,18vw,12rem);font-weight:900;letter-spacing:.05em;padding:2rem 3rem;border-radius:36px;background:linear-gradient(135deg,#fde68a,#fca5a5);box-shadow:0 16px 40px rgba(0,0,0,.18);display:inline-block;transition:transform .3s}
.instr{font-size:clamp(1.1rem,2.5vw,1.6rem);color:#475569;margin:1rem 0}
.progress{height:14px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:1rem 0}
.progress>div{height:100%;background:linear-gradient(90deg,#f97316,#ec4899);transition:width .4s}
.btn-big{font-size:1.3rem;padding:16px 32px;border-radius:20px}
</style>
</head>
<body>
<a class="back" href="../index.html">← Atpakaļ</a>
<header><h1>📖 Zilbju lasīšanas treniņš</h1><p class="subtitle">Izlasi zilbi skaļi!</p></header>
<div class="container">
<div class="game" style="text-align:center">
<p id="counter" class="instr">Zilbe 1 no 20</p>
<div class="syllable" id="syll">MA</div>
<p class="instr">Paskaties uz zilbi un izlasi to skaļi!<br>Vecāki klausās, kā bērnam izdodas.</p>
<div class="progress"><div id="bar" style="width:5%"></div></div>
<p id="score" style="font-weight:700">Progress: 1 / 20</p>
<div class="options" style="justify-content:center;margin-top:12px">
<button class="btn btn-big" id="listen">🔊 Klausīties izrunu</button>
<button class="btn btn-big" id="next">Nākamā zilbe →</button>
</div>
</div>
</div>
<script src="../js/speech.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/app.js"></script>
<script>
const SYLLS=['MA','ME','MI','MO','MU','LA','LE','LI','LO','LU','SA','SE','SI','SO','SU','PA','PE','PI','PO','PU','KA','KE','KI','KO','KU','RA','RE','RI','RO','RU'];
let idx=0;
const syllEl=document.getElementById('syll'),counter=document.getElementById('counter'),bar=document.getElementById('bar'),score=document.getElementById('score');
function render(){const s=SYLLS[idx%SYLLS.length];syllEl.textContent=s;counter.textContent='Zilbe '+(idx+1)+' no '+SYLLS.length;bar.style.width=((idx+1)/SYLLS.length*100)+'%';score.textContent='Progress: '+(idx+1)+' / '+SYLLS.length;try{if(window.SPEECH)window.SPEECH.cancel&&window.SPEECH.cancel()}catch(e){}}
document.getElementById('listen').onclick=()=>{window.speakLatvian(syllEl.textContent);if(window.AUDIO)window.AUDIO.beep(660,.1)};
document.getElementById('next').onclick=()=>{if(window.AUDIO)window.AUDIO.beep(880,.12);idx++;if(idx>=SYLLS.length){syllEl.textContent='Bravo!';counter.textContent='Pabeigts!';window.speakLatvian('Apsveicu! Tu pabeidzi zilbju treniņu!');return}render()};
render();
</script>
</body></html>
