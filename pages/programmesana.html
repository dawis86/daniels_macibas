<html lang="lv">

<script>WORLDS.programmesana=[{q:'Kas ir pirmais solis?',opts:[{t:'Uzsākt',c:true},{t:'Beigt',c:false},{t:'Dzēst',c:false}]},{q:'Ko nozīmē "atkārtot"?',opts:[{t:'Dari vēlreiz',c:true},{t:'Apturēt',c:false},{t:'Dzēst',c:false}]},{q:'Kāds ir pareizs secības piemērs?',opts:[{t:'1,2,3',c:true},{t:'3,1,2',c:false},{t:'2,3,1',c:false}]},{q:'Kas ir nosacījums?',opts:[{t:'Ja... tad...',c:true},{t:'Vienmēr',c:false},{t:'Nekad',c:false}]}];document.addEventListener('DOMContentLoaded',()=>initQuiz('programmesana'));</script>
